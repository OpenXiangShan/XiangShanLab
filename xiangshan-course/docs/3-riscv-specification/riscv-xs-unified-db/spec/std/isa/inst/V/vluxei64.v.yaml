# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vluxei64.v
long_name: Vector unordered load 1 element of 64 bits with index
description: |
  Loads 1 segment of 64-bit elements from memory using unordered access pattern with index register vs1, starting at address in xs1 register, using vector mask vm, and stores results in vector register vd. The effective element width is 64 bits.

xs-attributes:
    - microarchitectural_attributes:
        - VlduType: vluxe
        - latency: 17.543945
        - throughput: 0.071389
    - architectural_attributes:
        - exceptions: [AccessFault, AddrMisalign, PageFault_inst, IllegalInst, AddrMisalign_inst]

xs-constraints:
    - microarchitectural_attributes:
    - architectural_attributes:
        - operands:
            -   type: vreg
                width: 5
                reg_type: VECTOR
                field: vd
            -   type: reg
                width: 5
                reg_type: INTEGER
                field: rs1
                mem: true
            -   type: vreg
                width: 5
                reg_type: VECTOR
                field: vs2
            -   type: vm
                literal: v0.t
                option: true

definedBy:
  extension:
    name: Zvl32b
assembly: vd, (xs1), vs2, vm
encoding:
  match: 000001-----------111-----0000111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
