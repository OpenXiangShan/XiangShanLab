# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vs2r.v
long_name: "Vector store 2 elements"
description: |
  Stores 2 elements from vector register vs2 to memory starting at address in xs1 register, using vector mask vm. This operation stores elements with register stride.

xs-attributes:
    - microarchitectural_attributes:
        - VstuType: vsr
        - latency: 23.013672
        - throughput: 0.152200
    - architectural_attributes:
        - exceptions: [AccessFault, AddrMisalign, PageFault_inst, IllegalInst, AddrMisalign_inst]

xs-constraints:
    - microarchitectural_attributes:
    - architectural_attributes:
        - operands:
            -   type: vreg
                width: 5
                reg_type: VECTOR
                field: vs3
            -   type: reg
                width: 5
                reg_type: INTEGER
                field: rs1
                mem: true

definedBy:
  extension:
    name: Zvl32b
assembly: vs3, (xs1)
encoding:
  match: 001000101000-----000-----0100111
  variables:
    - name: xs1
      location: 19-15
    - name: vs3
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
