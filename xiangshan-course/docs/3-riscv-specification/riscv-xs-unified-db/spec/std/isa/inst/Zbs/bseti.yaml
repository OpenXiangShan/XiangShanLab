# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: bseti
long_name: Single-Bit set (Immediate)
description: |
  Returns xs1 with a single bit set at the index specified in shamt.
  The index is read from the lower log2(XLEN) bits of shamt.
  For RV32, the encodings corresponding to shamt[5]=1 are reserved.
xs-attributes:
    - microarchitectural_attributes:
        - FuType: alu
    - architectural_attributes:
        - exceptions: [IllegalInst, AddrMisalign_inst, PageFault_inst]

xs-constraints:
    - microarchitectural_attributes:
    - architectural_attributes:
        - operands:
            -   type: reg
                width: 5
            -   type: reg
                width: 5
            -   type: imm
                width: 5
                signed: false
                range: (0, 31)

definedBy:
  extension:
    name: Zbs
assembly: xd, xs1, shamt
encoding:
  RV32:
    match: 0010100----------001-----0010011
    variables:
      - name: shamt
        location: 24-20
      - name: xs1
        location: 19-15
      - name: xd
        location: 11-7
  RV64:
    match: 001010-----------001-----0010011
    variables:
      - name: shamt
        location: 25-20
      - name: xs1
        location: 19-15
      - name: xd
        location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  XReg index = shamt & (xlen() - 1);
  X[xd] = X[xs1] | (1 << index);
