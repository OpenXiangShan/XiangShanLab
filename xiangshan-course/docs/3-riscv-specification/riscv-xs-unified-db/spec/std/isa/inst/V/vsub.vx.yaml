# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vsub.vx
long_name: Vector-scalar integer subtraction
description: |
  Subtracts elements of vs2 from scalar rs1 according to mask vm and stores results in vd. Element width is determined by SEW setting.
xs-attributes:
    - microarchitectural_attributes:
        - FuType: vialuF.vsub_vv
    - architectural_attributes:
        - exceptions: [IllegalInst, AddrMisalign_inst, PageFault_inst]

xs-constraints:
    - microarchitectural_attributes:
    - architectural_attributes:
        - operands:
            -   type: vreg
                width: 5
                reg_type: VECTOR
                required: '!=v0'
                field: vd
            -   type: vreg
                width: 5
                reg_type: VECTOR
                field: vs2
            -   type: reg
                width: 5
                reg_type: INTEGER
                required: '!=x0'
                field: rs1
            -   type: vm
                literal: v0.t
                option: true

definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, xs1, vm
encoding:
  match: 000010-----------100-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
