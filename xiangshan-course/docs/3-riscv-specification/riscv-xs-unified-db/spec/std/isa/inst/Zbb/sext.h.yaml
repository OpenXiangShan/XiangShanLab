# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: sext.h
long_name: Sign-extend halfword
description: |
  Sign-extends the least-significant halfword in the source to XLEN by copying the
  most-significant bit in the halfword (i.e., bit 15) to all of the more-significant bits.
xs-attributes:
    - microarchitectural_attributes:
        - FuType: alu
        - latency: 1.032227
        - throughput: 2.652850
    - architectural_attributes:
        - exceptions: [IllegalInst, AddrMisalign_inst, PageFault_inst]

xs-constraints:
    - microarchitectural_attributes:
    - architectural_attributes:
        - operands:
            -   type: reg
                width: 5
            -   type: reg
                width: 5

definedBy:
  extension:
    name: Zbb
assembly: xd, xs1
encoding:
  match: 011000000101-----001-----0010011
  variables:
    - name: xs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  if (xlen() == 32) {
    X[xd] = {{16{X[xs1][15]}}, X[xs1][15:0]};
  } else if (xlen() == 64) {
    X[xd] = {{48{X[xs1][15]}}, X[xs1][15:0]};
  }
