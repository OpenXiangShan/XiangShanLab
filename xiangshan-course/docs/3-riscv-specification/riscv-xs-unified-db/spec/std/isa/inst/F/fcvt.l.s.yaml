# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: fcvt.l.s
long_name: Floating-Point Convert Single-Precision to Long
description: |
  The `fcvt.l.s` instruction converts a floating-point number in floating-point register `fs1` to a signed
  64-bit integer, in integer register `xd`.
xs-attributes:
    - microarchitectural_attributes:
        - FuType: fcvt
        - latency: 6.029297
        - throughput: 0.785276
    - architectural_attributes:
        - exceptions: [NX, NV, PageFault_inst, IllegalInst, AddrMisalign_inst]

xs-constraints:
    - microarchitectural_attributes:
    - architectural_attributes:
        - operands:
            -   type: reg
                reg_type: INTEGER
            -   type: freg
                reg_type: FLOAT

definedBy:
  allOf:
    - xlen: 64
    - extension:
        name: F
assembly: xd, fs1, rm
encoding:
  match: 110000000010-------------1010011
  variables:
    - name: fs1
      location: 19-15
    - name: rm
      location: 14-12
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);
  RoundingMode rounding_mode = rm_to_mode(rm, $encoding);
  X[xd] = f32_to_i64(F[fs1], rounding_mode);
