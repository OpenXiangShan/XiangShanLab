# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vnsrl.wx
long_name: "Vector narrowing logical shift right with scalar"
description: |
  Performs narrowing logical right shift on double-width elements from vector register vs2 by shift amount from scalar register xs1 and stores results in vector register vd, using vector mask vm. The operation fills with zeros and writes a single-width destination.
xs-attributes:
    - microarchitectural_attributes:
        - FuType: vialuF.vnsrl_wv
        - latency: 12.273438
        - throughput: 0.426667
    - architectural_attributes:
        - exceptions: [IllegalInst, AddrMisalign_inst, PageFault_inst]

xs-constraints:
    - microarchitectural_attributes:
    - architectural_attributes:
        - operands:
            -   type: vreg
                width: 5
                reg_type: VECTOR
                field: vd
            -   type: vreg
                width: 5
                reg_type: VECTOR
                field: vs2
            -   type: reg
                width: 5
                reg_type: INTEGER
                required: '!=x0'
                field: rs1
            -   type: vm
                literal: v0.t
                option: true

definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, xs1, vm
encoding:
  match: 101100-----------100-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
pseudoinstructions:
  - when: xs1 == 0
    to: vncvt.x.x.w vd, vs2, vm
data_independent_timing: false
operation(): |
