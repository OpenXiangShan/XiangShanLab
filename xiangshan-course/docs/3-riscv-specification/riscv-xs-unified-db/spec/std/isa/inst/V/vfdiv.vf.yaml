# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vfdiv.vf
long_name: Vector floating-point divide scalar
description: |
  Performs floating-point division on elements from vs2 and scalar from rs1, according to mask vm, and stores results in vd. Element width is determined by SEW setting. Follows IEEE-754 floating-point standards. Supports vector masking and follows vector tail policy.
xs-attributes:
    - microarchitectural_attributes:
        - FuType: vfdiv.vfdiv
        - latency: 13.335938
        - throughput: 0.106934
    - architectural_attributes:
        - exceptions: [NX, UF, OF, NV, PageFault_inst, IllegalInst, AddrMisalign_inst]

xs-constraints:
    - microarchitectural_attributes:
    - architectural_attributes:
        - operands:
            -   type: vreg
                width: 5
                reg_type: VECTOR
                required: '!=v0'
                field: vd
            -   type: vreg
                width: 5
                reg_type: VECTOR
                field: vs2
            -   type: freg
                width: 5
                reg_type: FLOAT
                field: rs1
            -   type: vm
                literal: v0.t
                option: true

definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, fs1, vm
encoding:
  match: 100000-----------101-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: fs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
