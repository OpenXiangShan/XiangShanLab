# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: flt.d
long_name: Floating-Point Less Than Double-Precision
definedBy:
  extension:
    oneOf:
      - name: D
      - name: Zdinx
description: |
  The `flt.d` instruction writes 1 to `xd` if `fs1` is less than `fs2`, and 0 otherwise. It is defined analogously to its
  single-precision counterpart, but operates on double-precision operands.
xs-attributes:
    - microarchitectural_attributes:
        - FuType: falu
        - latency: 4.529297
        - throughput: 1.422222

    - architectural_attributes:
        - exceptions: [IllegalInst]
            - NV​
            - AddrMisalign_inst
            - PageFault_inst

xs-constraints:
    - microarchitectural_attributes:
    - architectural_attributes:
        - operands:
            -   type: reg
                reg_type: INTEGER
            -   type: freg
                reg_type: FLOAT
            -   type: freg
                reg_type: FLOAT

assembly: xd, fs1, fs2
encoding:
  match: 1010001----------001-----1010011
  variables:
    - name: fs2
      location: 24-20
    - name: fs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
