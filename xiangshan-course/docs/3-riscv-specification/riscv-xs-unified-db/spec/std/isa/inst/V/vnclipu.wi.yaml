# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vnclipu.wi
long_name: "Vector narrowing unsigned clip with immediate"
description: |
  Performs narrowing unsigned clip operation on double-width elements from vector register vs2 using immediate clip value and stores results in vector register vd, using vector mask vm. The operation clips values to a specified range and packs the result into a narrower destination.
xs-attributes:
    - microarchitectural_attributes:
        - FuType: vialuF

xs-constraints:
    - microarchitectural_attributes:
    - architectural_attributes:
        - operands:
            -   type: vreg
                width: 5
                reg_type: VECTOR
                field: vd
            -   type: vreg
                width: 5
                reg_type: VECTOR
                field: vs2
            -   type: imm
                width: 5
                signed: false
                field: imm
            -   type: vm
                literal: v0.t
                option: true

definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, imm, vm
encoding:
  match: 101110-----------011-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: imm
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
