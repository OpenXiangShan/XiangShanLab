# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vse32.v
long_name: Vector store 32-bit elements
description: |
  Stores 32-bit elements from vector register vs3 to memory starting at address in xs1 register, using vector mask vm. The effective element width is 32 bits regardless of SEW setting.

xs-attributes:
    - microarchitectural_attributes:
        - VstuType: vse
        - latency: 23.013672
        - throughput: 0.276458
    - architectural_attributes:
        - exceptions: [AccessFault, AddrMisalign, PageFault_inst, IllegalInst, AddrMisalign_inst]

xs-constraints:
    - microarchitectural_attributes:
    - architectural_attributes:
        - operands:
            -   type: vreg
                width: 5
                reg_type: VECTOR
                field: vs3
            -   type: reg
                width: 5
                reg_type: INTEGER
                field: rs1
                mem: true
            -   type: vm
                literal: v0.t
                option: true

definedBy:
  extension:
    name: Zvl32b
assembly: vs3, (xs1), vm
encoding:
  match: 000000-00000-----110-----0100111
  variables:
    - name: vm
      location: 25-25
    - name: xs1
      location: 19-15
    - name: vs3
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
