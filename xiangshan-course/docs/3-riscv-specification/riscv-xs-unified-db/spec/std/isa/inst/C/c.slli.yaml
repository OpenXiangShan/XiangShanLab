# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: c.slli
long_name: Shift left logical immediate
description: |
  Shift the value in xd left by shamt, and store the result back in xd.
  C.SLLI expands into `slli xd, xd, shamt`.
xs-attributes:
    - microarchitectural_attributes:
        - FuType: alu.sll
        - latency: 1.257812
        - throughput: 1.454545
    - architectural_attributes:
        - exceptions: [IllegalInst, AddrMisalign_inst, PageFault_inst]

xs-constraints:
    - microarchitectural_attributes:
    - architectural_attributes:
        - operands:
            -   type: creg
                width: 5
                range: (0, 31)
            -   type: imm
                width: 5
                range: (1, 31)

definedBy:
  extension:
    name: Zca
assembly: xd, shamt
encoding:
  RV32:
    match: 0000----------10
    variables:
      - name: shamt
        location: 6-2
        not: 0
      - name: xd
        location: 11-7
  RV64:
    match: 000-----------10
    variables:
      - name: shamt
        location: 12|6-2
        not: 0
      - name: xd
        location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
  # shamt is between 0-63
  X[xd] = X[xd] << shamt;
