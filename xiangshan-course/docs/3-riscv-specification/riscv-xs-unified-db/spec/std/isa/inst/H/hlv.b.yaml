# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: hlv.b
long_name: Hypervisor load byte
description: |
  Load 8 bits of data into register `xd` from guest physical memory at the
  address in `xs1`, as though V=1. Sign-extend the result to XLEN bits.
xs-attributes:
    - microarchitectural_attributes:
        - FuType: ldu
    - architectural_attributes:
        - exceptions: [PageFault_load, AccessFault_load, PageFault_inst, IllegalInst, AddrMisalign_load, AddrMisalign_inst]

xs-constraints:
    - microarchitectural_attributes:
    - architectural_attributes:
        - operands:
            -   type: reg
                width: 5
                reg_type: INTEGER
                field: rd
            -   type: reg
                width: 5
                reg_type: INTEGER
                field: rs1
                mem: true

definedBy:
  extension:
    name: H
assembly: xd, xs1
encoding:
  match: 011000000000-----100-----1110011
  variables:
    - name: xs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
