# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: packw
long_name: No synopsis available
description: |
  No description available.
xs-attributes:
    - microarchitectural_attributes:
        - FuType: alu.packw
        - latency: 1.257812
        - throughput: 1.471264
    - architectural_attributes:
        - exceptions: [IllegalInst, AddrMisalign_inst, PageFault_inst]

xs-constraints:
    - microarchitectural_attributes:
    - architectural_attributes:
        - operands:
            -   type: reg
                width: 5
                reg_type: INTEGER
            -   type: reg
                width: 5
                reg_type: INTEGER
            -   type: reg
                width: 5
                reg_type: INTEGER

definedBy:
  allOf:
    - xlen: 64
    - extension:
        name: Zbkb
assembly: xd, xs1, xs2
encoding:
  match: 0000100----------100-----0111011
  variables:
    - name: xs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
pseudoinstructions:
  - when: (xs2 == 0x0)
    to: zext.h xd, xs1
operation(): |
