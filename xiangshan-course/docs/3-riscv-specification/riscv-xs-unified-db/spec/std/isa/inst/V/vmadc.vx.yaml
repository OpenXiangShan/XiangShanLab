# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmadc.vx
long_name: "Vector multiply-add with carry and scalar"
description: |
  Performs multiply-add operation on elements from vector register vs2 and scalar register xs1, adds the carry-in from vector register vs3, and stores results in vector register vd, using vector mask vm.
xs-attributes:
    - microarchitectural_attributes:
        - FuType: vialuF
        - latency: 6.273438
        - throughput: 0.761905

xs-constraints:
    - microarchitectural_attributes:
    - architectural_attributes:
        - operands:
            -   type: vreg
                width: 5
                reg_type: VECTOR
                required: ==v0
                field: vd
            -   type: vreg
                width: 5
                reg_type: VECTOR
                field: vs2
            -   type: reg
                width: 5
                reg_type: INTEGER
                required: '!=x0'
                field: rs1

definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, xs1
encoding:
  match: 0100011----------100-----1010111
  variables:
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
