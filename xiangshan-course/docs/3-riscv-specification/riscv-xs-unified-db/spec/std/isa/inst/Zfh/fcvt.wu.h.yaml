# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fcvt.wu.h
long_name: Floating-point Convert Half-precision to Word
definedBy:
  extension:
    oneOf:
      - name: Zfh
      - name: Zhinx
description: |
  `fcvt.wu.h` converts a half-precision floating-point number to a signed 32-bit unsigned integer.
xs-attributes:
    - microarchitectural_attributes:
        - FuType: fcvt.fcvt_wu_h
        - latency: 6.029297
        - throughput: 0.785276
    - architectural_attributes:
        - exceptions: [IllegalInst, AddrMisalign_inst, PageFault_inst]

xs-constraints:
    - microarchitectural_attributes:
    - architectural_attributes:
        - operands:
            -   type: reg
                width: 5
            -   type: freg
                reg_type: FLOAT
                width: 5

assembly: xd, fs1, rm
encoding:
  match: 110001000001-------------1010011
  variables:
    - name: fs1
      location: 19-15
    - name: rm
      location: 14-12
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
