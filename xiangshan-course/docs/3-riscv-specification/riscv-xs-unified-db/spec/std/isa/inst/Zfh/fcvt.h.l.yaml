# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fcvt.h.l
long_name: Floating-point Convert Long to Half-precision
definedBy:
  allOf:
    - xlen: 64
    - extension:
        oneOf:
          - name: Zfh
          - name: Zhinx
description: |
  `fcvt.h.l` converts a 64-bit signed integer to a half-precision floating-point number.
xs-attributes:
    - microarchitectural_attributes:
        - FuType: i2f
        - latency: 6.029297
        - throughput: 0.785276

    - architectural_attributes:
        - exceptions: [IllegalInst, AddrMisalign_inst, PageFault_inst]

xs-constraints:
    - microarchitectural_attributes:
    - architectural_attributes:
        - operands:
            -   type: freg
                reg_type: FLOAT
                width: 5
            -   type: reg
                width: 5

assembly: fd, xs1, rm
encoding:
  match: 110101000010-------------1010011
  variables:
    - name: xs1
      location: 19-15
    - name: rm
      location: 14-12
    - name: fd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
