# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fcvt.d.wu
long_name: Floating-Point Convert Unsigned Word to Double-Precision
definedBy:
  extension:
    oneOf:
      - name: D
      - name: Zdinx
description: |
  The `fcvt.d.wu` instruction converts a 32-bit unsigned integer in integer register `xs1` into a double-precision
  floating-point number in floating-point register `fd`. Note `fcvt.d.wu` always produces an exact result and is
  unaffected by rounding mode.
xs-attributes:
    - microarchitectural_attributes:
        - FuType: i2f
        - latency: 6.029297
        - throughput: 0.785276

    - architectural_attributes:
        - exceptions: [IllegalInst, AddrMisalign_inst, PageFault_inst]

xs-constraints:
    - microarchitectural_attributes:
    - architectural_attributes:
        - operands:
            -   type: freg
                reg_type: FLOAT
            -   type: reg
                reg_type: INTEGER

assembly: fd, xs1, rm
encoding:
  match: 110100100001-------------1010011
  variables:
    - name: xs1
      location: 19-15
    - name: rm
      location: 14-12
    - name: fd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
