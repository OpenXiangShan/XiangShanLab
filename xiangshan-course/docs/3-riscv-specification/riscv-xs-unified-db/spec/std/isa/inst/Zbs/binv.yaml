# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: binv
long_name: Single-Bit invert (Register)
description: |
  Returns xs1 with a single bit inverted at the index specified in xs2.
  The index is read from the lower log2(XLEN) bits of xs2.
xs-attributes:
    - microarchitectural_attributes:
        - FuType: alu.binv
    - architectural_attributes:
        - exceptions: [IllegalInst, AddrMisalign_inst, PageFault_inst]

xs-constraints:
    - microarchitectural_attributes:
    - architectural_attributes:
        - operands:
            -   type: reg
                width: 5
            -   type: reg
                width: 5
            -   type: reg
                width: 5

definedBy:
  extension:
    name: Zbs
assembly: xd, xs1, xs2
encoding:
  match: 0110100----------001-----0110011
  variables:
    - name: xs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  XReg index = X[xs2] & (xlen() - 1);
  X[xd] = X[xs1] ^ (1 << index);
