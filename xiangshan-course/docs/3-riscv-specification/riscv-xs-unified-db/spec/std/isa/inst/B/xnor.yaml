# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: xnor
long_name: Exclusive NOR
description: |
  Performs the bit-wise exclusive-NOR operation on xs1 and xs2.
xs-attributes:
    - microarchitectural_attributes:
        - FuType: alu.xnor
        - latency: 1.032227
        - throughput: 2.645995
    - architectural_attributes:
        - exceptions: [IllegalInst, AddrMisalign_inst, PageFault_inst]

xs-constraints:
    - microarchitectural_attributes:
    - architectural_attributes:
        - operands:
            -   type: reg
                width: 5
                reg_type: INTEGER
            -   type: reg
                width: 5
                reg_type: INTEGER
            -   type: reg
                width: 5
                reg_type: INTEGER

definedBy:
  extension:
    anyOf:
      - name: Zbb
      - name: Zbkb
assembly: xd, xs1, xs2
encoding:
  match: 0100000----------100-----0110011
  variables:
    - name: xs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
  X[xd] = ~(X[xs1] ^ X[xs2]);
