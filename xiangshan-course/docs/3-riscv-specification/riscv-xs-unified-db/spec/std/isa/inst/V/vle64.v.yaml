# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vle64.v
long_name: Vector load 64-bit elements
description: |
  Loads 64-bit elements from memory starting at address in xs1 register, using vector mask vm, and stores results in vector register vd. The effective element width is 64 bits regardless of SEW setting.

xs-attributes:
    - microarchitectural_attributes:
        - VlduType: vle
        - latency: 23.013672
        - throughput: 0.203498
    - architectural_attributes:
        - exceptions: [AccessFault, AddrMisalign, PageFault_inst, IllegalInst, AddrMisalign_inst]

xs-constraints:
    - microarchitectural_attributes:
    - architectural_attributes:
        - operands:
            -   type: vreg
                width: 5
                reg_type: VECTOR
                field: vd
            -   type: reg
                width: 5
                reg_type: INTEGER
                field: rs1
                mem: true
            -   type: vm
                literal: v0.t
                option: true

definedBy:
  extension:
    name: Zvl32b
assembly: vd, (xs1), vm
encoding:
  match: 000000-00000-----111-----0000111
  variables:
    - name: vm
      location: 25-25
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
