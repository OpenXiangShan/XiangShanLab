# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: rori
long_name: Rotate right (Immediate)
description: |
  Performs a rotate right of xs1 by the amount in the least-significant log2(XLEN) bits of shamt.
  For RV32, the encodings corresponding to shamt[5]=1 are reserved.
xs-attributes:
    - microarchitectural_attributes:
        - FuType: alu.ror
    - architectural_attributes:
        - exceptions: [IllegalInst, AddrMisalign_inst, PageFault_inst]

xs-constraints:
    - microarchitectural_attributes:
    - architectural_attributes:
        - operands:
            -   type: reg
                width: 5
                reg_type: INTEGER
            -   type: reg
                width: 5
                reg_type: INTEGER
            -   type: imm
                width: 6
                signed: false
                range: (0, 63)

definedBy:
  extension:
    anyOf:
      - name: Zbb
      - name: Zbkb
assembly: xd, xs1, shamt
encoding:
  RV32:
    match: 0110000----------101-----0010011
    variables:
      - name: shamt
        location: 24-20
      - name: xs1
        location: 19-15
      - name: xd
        location: 11-7
  RV64:
    match: 011000-----------101-----0010011
    variables:
      - name: shamt
        location: 25-20
      - name: xs1
        location: 19-15
      - name: xd
        location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
  XReg shamt = (xlen() == 32) ? shamt[4:0] : shamt[5:0];

  X[xd] = (X[xs1] >> shamt) | (X[xs1] << (xlen() - shamt));
