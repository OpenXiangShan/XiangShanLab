# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: lw
long_name: Load word
description: |
  Load 32 bits of data into register `xd` from an
  address formed by adding `xs1` to a signed offset.
  Sign extend the result.
xs-attributes:
    - microarchitectural_attributes:
        - FuType: ldu
        - latency: 3.721680
        - throughput: 0.915103
    - architectural_attributes:
        - exceptions: [PageFault_load, AccessFault_load, PageFault_inst, IllegalInst, AddrMisalign_load, AddrMisalign_inst]

xs-constraints:
    - microarchitectural_attributes:
    - architectural_attributes:
        - operands:
            -   type: reg
                width: 5
                reg_type: INTEGER
            -   type: reg
                width: 5
                reg_type: INTEGER
            -   type: imm
                width: 12
                signed: true
                range: (-2048, 2047)

definedBy:
  extension:
    name: I
assembly: xd, imm(xs1)
encoding:
  match: "-----------------010-----0000011"
  variables:
    - name: imm
      location: 31-20
      sign_extend: true
    - name: xs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  XReg virtual_address = X[xs1] + $signed(imm);

  X[xd] = sext(read_memory(32, virtual_address, $encoding), 32);
