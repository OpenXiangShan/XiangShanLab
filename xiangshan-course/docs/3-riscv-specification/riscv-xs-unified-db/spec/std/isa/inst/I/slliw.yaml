# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: slliw
long_name: Shift left logical immediate word
description:
  Shift the 32-bit value in xs1 left by shamt, and store the sign-extended
  result in xd
xs-attributes:
    - microarchitectural_attributes:
        - FuType: alu.sllw
        - latency: 1.032227
        - throughput: 2.645995
    - architectural_attributes:
        - exceptions: [IllegalInst, AddrMisalign_inst, PageFault_inst]

xs-constraints:
    - microarchitectural_attributes:
    - architectural_attributes:
        - operands:
            -   type: reg
                width: 5
                reg_type: INTEGER
            -   type: reg
                width: 5
                reg_type: INTEGER
            -   type: imm
                width: 5
                signed: false
                range: (0, 31)

definedBy:
  allOf:
    - xlen: 64
    - extension:
        name: I
assembly: xd, xs1, shamt
encoding:
  match: 0000000----------001-----0011011
  variables:
    - name: shamt
      location: 24-20
    - name: xs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
  # shamt is between 0-32
  X[xd] = sext(X[xs1] << shamt, 32);
