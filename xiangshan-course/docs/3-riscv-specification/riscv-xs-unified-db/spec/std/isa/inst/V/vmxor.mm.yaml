# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmxor.mm
long_name: No synopsis available
description: |
  No description available.
xs-attributes:
    - microarchitectural_attributes:
        - FuType: vialuF.vmxor_mm
    - architectural_attributes:
        - exceptions: [IllegalInst, AddrMisalign_inst, PageFault_inst]

xs-constraints:
    - microarchitectural_attributes:
    - architectural_attributes:
        - operands:
            -   type: vreg
                width: 5
                reg_type: VECTOR
                field: vd
            -   type: vreg
                width: 5
                reg_type: VECTOR
                field: vs2
            -   type: vreg
                width: 5
                reg_type: VECTOR
                field: vs1

definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, vs1
encoding:
  match: 0110111----------010-----1010111
  variables:
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
pseudoinstructions:
  - when: (vs2 == vs1) && (vd == vs2)
    to: vmclr.m vd
data_independent_timing: false
operation(): |
