# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: auipc
long_name: Add upper immediate to pc
description: Add an immediate to the current PC.
xs-attributes:
    - microarchitectural_attributes:
        - FuType: jmp
        - throughput: 2.316742
    - architectural_attributes:
        - exceptions: [IllegalInst, AddrMisalign_inst, PageFault_inst]

xs-constraints:
    - microarchitectural_attributes:
    - architectural_attributes:
        - operands:
            -   type: reg
                width: 5
                reg_type: INTEGER
            -   type: imm
                width: 20
                signed: false

definedBy:
  extension:
    name: I
assembly: xd, imm
encoding:
  match: "-------------------------0010111"
  variables:
    - name: imm
      location: 31-12
      left_shift: 12
      sign_extend: true
    - name: xd
      location: 11-7
hints:
  - { $ref: inst/Zicfilp/lpad.yaml# }
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): X[xd] = $pc + $signed(imm);
