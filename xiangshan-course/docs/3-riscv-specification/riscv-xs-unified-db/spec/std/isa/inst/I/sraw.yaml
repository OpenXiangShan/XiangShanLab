# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: sraw
long_name: Shift right arithmetic word
description: |
  Arithmetic shift the 32-bit value in `xs1` right by the value in the lower 5 bits of `xs2`, and store the sign-extended result in `xd`.
xs-attributes:
    - microarchitectural_attributes:
        - FuType: alu.sraw
        - latency: 1.032227
        - throughput: 2.645995
    - architectural_attributes:
        - exceptions: [IllegalInst, AddrMisalign_inst, PageFault_inst]

xs-constraints:
    - microarchitectural_attributes:
    - architectural_attributes:
        - operands:
            -   type: reg
                width: 5
                reg_type: INTEGER
            -   type: reg
                width: 5
                reg_type: INTEGER
            -   type: reg
                width: 5
                reg_type: INTEGER

definedBy:
  allOf:
    - xlen: 64
    - extension:
        name: I
assembly: xd, xs1, xs2
encoding:
  match: 0100000----------101-----0111011
  variables:
    - name: xs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
  XReg operand1 = sext(X[xs1], 32);

  X[xd] = sext(operand1 >>> X[xs2][4:0], 32);
