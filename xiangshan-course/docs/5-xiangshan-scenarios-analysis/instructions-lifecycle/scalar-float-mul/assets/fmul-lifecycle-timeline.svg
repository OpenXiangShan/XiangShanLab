<rect x="158" y="905" width="140" height="28" rx="9" fill="#DEDEDE"/>
<rect x="155" y="902" width="140" height="28" rx="9" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.6"/>
<text class="stage" x="225" y="921" text-anchor="middle">结果</text>
<text class="cyc" x="125" y="921" text-anchor="end">4347</text>
<text x="320" y="910"><tspan class="m">io_fp_result = 0xFFFFFFFF7F800000</tspan><tspan class="d">，</tspan><tspan class="m">io_fflags = 0x05</tspan></text>
<text x="320" y="928"><tspan class="m">inner_dataPath.io_fromFpWb_2</tspan><tspan class="d">：</tspan><tspan class="v">addr = 0x44</tspan><tspan class="d">，</tspan><tspan class="v">data = 0xFFFFFFFF7F800000</tspan></text>
<line x1="140" y1="936" x2="140" y2="951" stroke="#B8B8B8" stroke-width="2" marker-end="url(#ag)"/>
<line x1="140" y1="969" x2="155" y2="969" stroke="#999" stroke-width="1.4"/>
<circle cx="140" cy="969" r="5" fill="#9B59B6"/>
<rect x="158" y="958" width="140" height="28" rx="9" fill="#DEDEDE"/>
<rect x="155" y="955" width="140" height="28" rx="9" fill="#F3E8F9" stroke="#9B59B6" stroke-width="1.6"/>
<text class="stage" x="225" y="974" text-anchor="middle">写回</text>
<text class="cyc" x="125" y="974" text-anchor="end">4348</text>
<text x="320" y="973"><tspan class="d">写回把 </tspan><tspan class="v">0x44</tspan><tspan class="d"> 与结果打进浮点寄存器堆；写地址、数据、使能比写回总线各晚一拍</tspan></text>
<line x1="140" y1="989" x2="140" y2="995" stroke="#B8B8B8" stroke-width="2" marker-end="url(#ag)"/>
<line x1="140" y1="1013" x2="155" y2="1013" stroke="#999" stroke-width="1.4"/>
