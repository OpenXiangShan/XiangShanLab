<text class="stage" x="225" y="1106" text-anchor="middle">CSR 收到</text>
<text class="cyc" x="125" y="1106" text-anchor="end">4351</text>
<text x="320" y="1105"><tspan class="m">fcsr.robCommit_fflags_valid = 1</tspan><tspan class="d">，</tspan><tspan class="m">bits = 0x05</tspan></text>
<line x1="140" y1="1121" x2="140" y2="1136" stroke="#B8B8B8" stroke-width="2" marker-end="url(#ag)"/>
