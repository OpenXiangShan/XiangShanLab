<rect x="155" y="1043" width="140" height="28" rx="9" fill="#E8F1FB" stroke="#4A7EBB" stroke-width="1.6"/>
<text class="stage" x="225" y="1062" text-anchor="middle">ROB→CSR</text>
<text class="cyc" x="125" y="1062" text-anchor="end">4350</text>
<text x="320" y="1061"><tspan class="m">rob.io_csr_fflags_valid = 1</tspan><tspan class="d">，</tspan><tspan class="m">bits = 0x05</tspan></text>
<line x1="140" y1="1077" x2="140" y2="1083" stroke="#B8B8B8" stroke-width="2" marker-end="url(#ag)"/>
