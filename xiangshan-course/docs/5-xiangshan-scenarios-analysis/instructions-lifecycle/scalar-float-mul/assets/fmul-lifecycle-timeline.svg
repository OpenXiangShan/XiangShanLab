<rect x="158" y="755" width="140" height="28" rx="9" fill="#DEDEDE"/>
<rect x="155" y="752" width="140" height="28" rx="9" fill="#E8F1FB" stroke="#4A7EBB" stroke-width="1.6"/>
<text class="stage" x="225" y="771" text-anchor="middle">执行 S0</text>
<text class="cyc" x="125" y="771" text-anchor="end">4344</text>
<text x="320" y="760"><tspan class="m">fp_a = 0xFFFFFFFF7F7FFFFF</tspan><tspan class="d">（最大有限数），</tspan><tspan class="m">fp_b = 0xFFFFFFFF40000000</tspan><tspan class="d">（2.0）</tspan></text>
<text x="320" y="778"><tspan class="m">fp_c = 0x0</tspan><tspan class="d">；</tspan><tspan class="m">fmt = 0x2</tspan><tspan class="d">、</tspan><tspan class="m">rm = 0x0</tspan><tspan class="d">、</tspan><tspan class="m">op_code = 0x0</tspan><tspan class="d">，与译码一致</tspan></text>
<line x1="140" y1="786" x2="140" y2="801" stroke="#B8B8B8" stroke-width="2" marker-end="url(#ag)"/>
<line x1="140" y1="819" x2="155" y2="819" stroke="#999" stroke-width="1.4"/>
<circle cx="140" cy="819" r="5" fill="#4A7EBB"/>
<rect x="158" y="808" width="140" height="28" rx="9" fill="#DEDEDE"/>
<rect x="155" y="805" width="140" height="28" rx="9" fill="#E8F1FB" stroke="#4A7EBB" stroke-width="1.6"/>
<text class="stage" x="225" y="824" text-anchor="middle">执行 S1</text>
<text class="cyc" x="125" y="824" text-anchor="end">4345</text>
<text x="320" y="823"><tspan class="d">尾数阵列、指数相加与规格化在流水里推进；源是不是特殊值不影响这一拍</tspan></text>
<line x1="140" y1="839" x2="140" y2="845" stroke="#B8B8B8" stroke-width="2" marker-end="url(#ag)"/>
<line x1="140" y1="863" x2="155" y2="863" stroke="#999" stroke-width="1.4"/>
<circle cx="140" cy="863" r="5" fill="#4A7EBB"/>
<rect x="158" y="852" width="140" height="28" rx="9" fill="#DEDEDE"/>
<rect x="155" y="849" width="140" height="28" rx="9" fill="#E8F1FB" stroke="#4A7EBB" stroke-width="1.6"/>
<text class="stage" x="225" y="868" text-anchor="middle">执行 S2</text>
<text class="cyc" x="125" y="868" text-anchor="end">4346</text>
<text x="320" y="867"><tspan class="d">三级流水的最后一拍，特殊值选择与装箱在这一拍完成</tspan></text>
<line x1="140" y1="883" x2="140" y2="898" stroke="#B8B8B8" stroke-width="2" marker-end="url(#ag)"/>
<line x1="140" y1="916" x2="155" y2="916" stroke="#999" stroke-width="1.4"/>
