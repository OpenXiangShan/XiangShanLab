<rect x="158" y="1002" width="140" height="28" rx="9" fill="#DEDEDE"/>
<rect x="155" y="999" width="140" height="28" rx="9" fill="#E8F1FB" stroke="#4A7EBB" stroke-width="1.6"/>
<text class="stage" x="225" y="1018" text-anchor="middle">提交</text>
<text class="cyc" x="125" y="1018" text-anchor="end">4349</text>
<text x="320" y="1017"><tspan class="m">rob.io_commits_commitValid_0 = 1</tspan><tspan class="d">，</tspan><tspan class="v">robIdx = 0x35</tspan><tspan class="d">；与前面的 </tspan><tspan class="m">fmv.w.x</tspan><tspan class="d"> 一起退休</tspan></text>
<line x1="140" y1="1033" x2="140" y2="1039" stroke="#B8B8B8" stroke-width="2" marker-end="url(#ag)"/>
