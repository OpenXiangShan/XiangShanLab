<text class="cyc" x="125" y="1159" text-anchor="end">4352</text>
<text x="320" y="1148"><tspan class="m">fcsr.fflags = 0x05</tspan><tspan class="d">，</tspan><tspan class="m">reg_OF = 1</tspan><tspan class="d">，</tspan><tspan class="m">reg_NX = 1</tspan></text>
<rect x="313" y="311" width="900" height="54" rx="10" fill="#DEDEDE"/>
