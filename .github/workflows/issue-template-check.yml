name: Issue Template Check

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

jobs:
  validate-task:
    name: Validate task request
    if: startsWith(github.event.issue.title, '[TASK]') && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check required task fields
        uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scripts/issue-template-check.cjs');
            await run({ github, context, core });
