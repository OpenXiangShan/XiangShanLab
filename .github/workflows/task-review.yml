name: Task Review

on:
  issue_comment:
    types: [created]
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write

concurrency:
  group: task-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  handle-review:
    name: Handle review command
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - name: Process review
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const currentComment = context.payload.comment;
            const command = currentComment.body.trim();
            if (issue.pull_request || !/^\[TASK\]\s+\S/.test(issue.title)) {
              return;
            }
            if (command.toLowerCase() !== '/complete') {
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = issue.number;
            const actor = currentComment.user.login;
            const sameUser = (left, right) => left.toLowerCase() === right.toLowerCase();

            async function reply(body) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body
              });
            }

            const isAssignee = issue.assignees.some(assignee => sameUser(assignee.login, actor));
            if (!isAssignee) {
              await reply(`只有当前 Assignee 可以使用 \`/complete\` 提交完成。`);
              return;
            }

            const resolvedMarker = `<!-- task-review:resolved executor=${actor} -->`;
            await reply(`${resolvedMarker}\n@${actor} 已提交任务，Issue 自动关闭。`);
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed'
            });

  guard-close:
    name: Guard premature closure
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Reopen unapproved task
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!/^\[TASK\]\s+\S/.test(issue.title)) {
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100
            });
            const markerPattern = /<!-- task-review:resolved executor=([A-Za-z0-9-]+) -->/;
            const lastState = [...comments].reverse().find(comment =>
              comment.user?.login === 'github-actions[bot]' && markerPattern.test(comment.body || '')
            );
            if (lastState) {
              return;
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'open'
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: '关闭已撤销：任务必须由当前 Assignee 使用 `/complete` 提交完成后才能关闭。'
            });
