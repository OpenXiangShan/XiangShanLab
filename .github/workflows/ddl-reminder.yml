name: DDL Reminder

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ddl-reminder
  cancel-in-progress: false

jobs:
  remind:
    name: Remind upcoming task deadlines
    runs-on: ubuntu-latest
    steps:
      - name: Check task deadlines
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const reminderWindow = 12 * 60 * 60 * 1000;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            function section(body, label) {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const match = (body || '').match(
                new RegExp(`(?:^|\\n)### ${escaped}\\r?\\n([\\s\\S]*?)(?=\\r?\\n### |$)`)
              );
              return match?.[1].trim() || '';
            }

            for (const issue of issues) {
              if (
                issue.pull_request ||
                !/^\[TASK\]\s+\S/.test(issue.title) ||
                !issue.assignees.length
              ) {
                continue;
              }

              const ddl = section(issue.body, '截止时间（DDL）');
              const match = ddl.match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})$/);
              if (!match) {
                core.warning(`Skip #${issue.number}: invalid or missing DDL`);
                continue;
              }

              const [, year, month, day, hour, minute] = match.map(Number);
              const daysInMonth = new Date(Date.UTC(year, month, 0)).getUTCDate();
              if (month < 1 || month > 12 || day < 1 || day > daysInMonth) {
                core.warning(`Skip #${issue.number}: invalid DDL date`);
                continue;
              }

              const y = String(year).padStart(4, '0');
              const mo = String(month).padStart(2, '0');
              const d = String(day).padStart(2, '0');
              const h = String(hour).padStart(2, '0');
              const mi = String(minute).padStart(2, '0');
              const deadline = new Date(
                `${y}-${mo}-${d}T${h}:${mi}:00+08:00`
              );
              const remaining = deadline.getTime() - Date.now();
              if (remaining <= 0 || remaining > reminderWindow) {
                continue;
              }

              const marker = `<!-- ddl-reminder:${ddl.replace(' ', 'T')}+08:00 -->`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issue.number,
                per_page: 100
              });
              if (comments.some(comment => comment.body?.includes(marker))) {
                continue;
              }

              const recipients = issue.assignees.map(assignee => assignee.login);
              const mentions = recipients.map(login => `@${login}`).join(' ');
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `${marker}\n${mentions}，距离任务 DDL 已不足 12 小时。截止时间：\`${ddl}\`（北京时间 UTC+8），请及时完成交付。`
              });
            }
