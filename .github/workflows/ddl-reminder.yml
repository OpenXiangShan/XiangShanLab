name: DDL Reminder

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ddl-reminder
  cancel-in-progress: false

jobs:
  remind:
    name: Remind upcoming task deadlines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check task deadlines
        uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scripts/ddl-reminder.cjs');
            await run({ github, context, core });
